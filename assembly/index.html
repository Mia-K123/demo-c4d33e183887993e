<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>L11 組裝教學 · 2U 示範伺服器</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0b0f16;
    --panel: rgba(14, 20, 30, .78);
    --panel-solid: #141c28;
    --line: rgba(255,255,255,.14);
    --line-strong: rgba(255,255,255,.22);
    --text: #eef3fa;
    --muted: #9aacbf;
    --acc: #3ee0c8;
    --acc-dim: rgba(62,224,200,.16);
    --warn: #ffb020;
    --warn-dim: rgba(255,176,32,.16);
    --ok: #5bd68a;
    --ok-dim: rgba(91,214,138,.16);
    --danger: #ff6b6b;
    --shadow: 0 10px 40px rgba(0,0,0,.35);
    --radius: 14px;
    --sidebar: 300px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  body { background: radial-gradient(120% 80% at 50% 28%, #243044 0%, #121822 55%, #07090d 100%); }
  button, input { font: inherit; color: inherit; }
  a { color: var(--acc); }

  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .lbl { position: absolute; left: 0; top: 0; padding: 3px 8px 4px; border-radius: 8px;
    background: rgba(10,16,26,.78); border: 1px solid rgba(255,176,32,.55);
    font-size: 12px; line-height: 1.15; white-space: nowrap; text-align: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity .2s; }
  .lbl b { display: block; font-weight: 650; }
  .lbl small { display: block; font-size: 9.5px; color: #d7c39a; }

  header.top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 8;
    padding: calc(var(--safe-t) + 8px) 12px 8px;
    display: flex; align-items: flex-start; gap: 8px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(7,9,13,.72), rgba(7,9,13,0));
  }
  header.top > * { pointer-events: auto; }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 720; letter-spacing: .02em; }
  .brand p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .code-pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(0,0,0,.28); font-variant-numeric: tabular-nums; font-size: 10.5px; color: var(--acc); }
  .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }

  .btn { appearance: none; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; line-height: 1.2;
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset; }
  .btn:hover { border-color: var(--line-strong); background: rgba(22,30,44,.88); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--acc); color: #04231e; border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.06); background: var(--acc); }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 6px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.on { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-dim); }
  .btn.disabled { opacity: .4; }

  #btnMenu { display: none; }

  aside.sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar); z-index: 7;
    padding: calc(var(--safe-t) + 72px) 12px calc(var(--safe-b) + 16px);
    background: linear-gradient(90deg, rgba(8,12,18,.88) 70%, rgba(8,12,18,0));
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none;
  }
  aside.sidebar > * { pointer-events: auto; }
  .side-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px; }
  .side-head h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .prog { font-size: 12px; color: var(--acc); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; margin: 0 6px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2aa992, var(--acc)); border-radius: 99px; transition: width .35s ease; }

  #stepList { list-style: none; margin: 0; padding: 4px; overflow: auto; flex: 1;
    border-radius: 16px; background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: var(--shadow); }
  #stepList li { margin: 0; }
  #stepList button.step-item {
    width: 100%; text-align: left; border: 0; background: transparent; color: inherit;
    border-radius: 10px; padding: 8px 8px; display: grid; grid-template-columns: 28px 1fr auto; gap: 8px;
    align-items: center; cursor: pointer; font-weight: 550; }
  #stepList button.step-item:hover { background: rgba(255,255,255,.05); }
  #stepList button.step-item.current { background: var(--warn-dim); }
  #stepList button.step-item.done:not(.current) { color: #cfe7d8; }
  .idx { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; border: 1px solid var(--line); color: var(--muted); }
  .current .idx { background: var(--warn); color: #2a1c00; border-color: transparent; }
  .done .idx { background: var(--ok-dim); color: var(--ok); border-color: rgba(91,214,138,.4); }
  .step-item .name { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step-item .mark { font-size: 12px; color: var(--ok); }
  .disclaimer { font-size: 10.5px; line-height: 1.45; color: #7f8fa3; padding: 0 8px; }

  #card {
    position: fixed; z-index: 8; right: 16px; bottom: calc(var(--safe-b) + 16px);
    width: min(420px, calc(100vw - var(--sidebar) - 36px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: var(--shadow); padding: 14px 16px 12px; touch-action: pan-y;
  }
  #card .kicker { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11px; letter-spacing: .08em; color: var(--warn); font-weight: 700; }
  #card h3 { margin: 4px 0 6px; font-size: 18px; font-weight: 750; }
  #card .inst { margin: 0 0 10px; font-size: 13.5px; line-height: 1.55; color: #d5deea; }
  .tools { display: grid; gap: 6px; margin: 0 0 10px; }
  .tool { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: start;
    font-size: 12.5px; padding: 6px 8px; border-radius: 10px; background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.06); }
  .tool dt { margin: 0; color: var(--muted); font-weight: 650; }
  .tool dd { margin: 0; }
  .ex { font-size: 10px; color: #c9a15a; background: var(--warn-dim); border: 1px solid rgba(255,176,32,.28);
    border-radius: 999px; padding: 1px 6px; white-space: nowrap; }
  .notes { font-size: 11.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.45; }
  .card-nav { display: flex; align-items: center; gap: 8px; }
  .complete { display: flex; align-items: center; gap: 8px; flex: 1; font-size: 13.5px; font-weight: 650; cursor: pointer; user-select: none; }
  .complete input { appearance: none; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line);
    background: rgba(0,0,0,.25); display: grid; place-items: center; margin: 0; cursor: pointer; }
  .complete input:checked { background: var(--ok); border-color: var(--ok); }
  .complete input:checked::after { content: ""; width: 11px; height: 6px; border: 2px solid #063; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

  .kicker-actions { display: flex; align-items: center; gap: 6px; }
  .sheet-handle { display: none; }
  #btnSheet { display: none; }
  .swipe-hint { display: none; font-size: 10.5px; color: #7f8fa3; text-align: center; margin: 8px 0 0; }

  #gesture { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 58px);
    display: none; align-items: center; gap: 8px; z-index: 8;
    padding: 7px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
    font-size: 13px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 92vw; white-space: nowrap; }
  body.gestures #gesture { display: flex; }
  #pip { position: fixed; right: 12px; top: calc(var(--safe-t) + 86px); width: 96px; height: 72px; border-radius: 10px;
    background: rgba(0,0,0,.35); border: 1px solid var(--line); display: none; overflow: hidden; z-index: 6; }
  body.gestures #pip { display: block; }
  #video, #scanVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #video.mirror { transform: scaleX(-1); }
  #hand { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: rgba(7,9,13,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #loading.hide { display: none; }
  #loadtxt { font-size: 14px; color: #d5deea; padding: 12px 18px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
  .pct { color: var(--acc); font-variant-numeric: tabular-nums; }

  #toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 24px); transform: translateX(-50%) translateY(20px);
    z-index: 30; max-width: min(92vw, 440px); padding: 10px 16px; border-radius: 12px;
    background: #1b2430; border: 1px solid var(--line); box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: .25s ease; font-size: 13.5px; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal { position: fixed; inset: 0; z-index: 25; background: rgba(4,6,10,.62);
    display: grid; place-items: center; padding: 24px 16px; }
  .modal[hidden] { display: none !important; }
  .sheet { width: min(520px, 100%); background: var(--panel-solid); border: 1px solid var(--line);
    border-radius: 20px; padding: 18px 18px 16px; box-shadow: var(--shadow); }
  .sheet h2 { margin: 0 0 6px; font-size: 18px; }
  .sheet .lead { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .scan-view { position: relative; height: 240px; border-radius: 14px; overflow: hidden; background: #000; border: 1px solid var(--line); }
  .scan-frame { position: absolute; inset: 18% 18%; border: 2px solid var(--acc); border-radius: 12px; box-shadow: 0 0 0 80vmax rgba(0,0,0,.28); pointer-events: none; }
  .sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .sheet input[type=text] { flex: 1; min-width: 140px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(0,0,0,.28); padding: 8px 12px; outline: none; }
  .sheet input[type=text]:focus { border-color: var(--acc); }
  .file-btn input { display: none; }


  body.annotating #gl { cursor: crosshair; }
  body.annotating #btnAnnotate { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-dim); }
  #card { max-height: calc(100vh - 130px); overflow: auto; }
  .ann-sec { margin: 0 0 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .ann-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .ann-head h4 { margin: 0; font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .ann-head .row { display: flex; gap: 4px; flex-wrap: wrap; }
  .ann-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 132px; overflow: auto; }
  .ann-list:empty::after { content: "本步驟尚無標註。按「新增」後，點模型表面即可放置。"; display: block; font-size: 12px; color: var(--muted); padding: 4px 2px 2px; }
  button.ann-item { width: 100%; text-align: left; border: 1px solid transparent; background: rgba(0,0,0,.18);
    color: inherit; border-radius: 10px; padding: 6px 8px; display: grid; grid-template-columns: 22px 1fr auto;
    gap: 6px; align-items: center; cursor: pointer; font-size: 12.5px; }
  button.ann-item:hover { background: rgba(255,255,255,.06); }
  button.ann-item.sel { border-color: var(--warn); background: var(--warn-dim); }
  .ann-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.35); justify-self: center; }
  .ann-item .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
  .ann-item .kind { font-size: 10.5px; color: var(--muted); }
  .types { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .types button { flex: 1; min-width: 72px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch.sel { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  .sheet label.fld { display: block; font-size: 12px; color: var(--muted); font-weight: 650; margin: 0 0 6px; }
  .sheet textarea { width: 100%; min-height: 72px; resize: vertical; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(0,0,0,.28); color: inherit; padding: 8px 10px; outline: none; margin: 0 0 12px; }
  .sheet textarea:focus { border-color: var(--acc); }
  .sheet .part-line { font-size: 13px; color: #d5deea; margin: 0 0 12px; }

  body.ar header.top, body.ar aside.sidebar, body.ar #card, body.ar #gesture, body.ar #pip { display: none !important; }
  #arOverlay { display: none; position: fixed; inset: 0; z-index: 15; pointer-events: none; }
  body.ar #arOverlay { display: block; }
  .ar-bar { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: auto;
    padding: 12px 12px calc(var(--safe-b) + 12px);
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.65)); }
  .ar-bar p { margin: 0 0 10px; text-align: center; font-size: 13px; color: #e8eef6; }
  .ar-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 6; }
  body.sidebar-open .backdrop { display: block; }

  .wide { display: inline; }
  @media (max-width: 900px) {
    #btnMenu { display: inline-flex; }
    aside.sidebar {
      width: min(88vw, 340px); transform: translateX(-105%); transition: transform .28s ease;
      background: var(--panel-solid); border-right: 1px solid var(--line);
      pointer-events: auto; padding-top: calc(var(--safe-t) + 16px); z-index: 9;
    }
    body.sidebar-open aside.sidebar { transform: none; }
    #card {
      left: 0; right: 0; width: auto; bottom: 0;
      border-radius: 18px 18px 0 0;
      padding: 0 14px calc(var(--safe-b) + 10px);
      max-height: 72dvh;
      overflow: auto;
      touch-action: pan-y;
    }
    .sheet-handle { display: flex; justify-content: center; align-items: center; padding: 9px 0 4px; touch-action: none; cursor: grab; }
    .sheet-handle i { width: 40px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.32); }
    #btnSheet { display: inline-flex; }
    #card h3 { margin: 2px 0 8px; font-size: 16.5px; }
    .card-nav { position: sticky; bottom: -1px; padding-top: 8px; background: linear-gradient(180deg, rgba(20,28,40,0), rgba(20,28,40,.94) 30%, var(--panel-solid)); }
    .ann-list { max-height: 84px; }
    #card .inst { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .swipe-hint { display: block; }
    body.sheet-collapsed #sheetBody,
    body.sheet-collapsed .swipe-hint,
    body.sheet-collapsed #btnReplay { display: none; }
    body.sheet-collapsed #card { max-height: none; overflow: hidden; }
    body.sheet-collapsed #card h3 { margin: 0 0 8px; font-size: 16px; }
    #toast { bottom: calc(var(--safe-b) + var(--sheet-h, 108px) + 12px); }
    header.top { flex-wrap: nowrap; align-items: center; gap: 6px;
      background: linear-gradient(180deg, rgba(7,9,13,.88), rgba(7,9,13,0)); }
    .brand { min-width: 0; }
    .brand h1 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand p { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
    #deviceName { display: none; }
    .actions { flex: 0 0 auto; flex-wrap: nowrap; gap: 4px; }
    .actions .btn.small { padding: 6px 8px; font-size: 12px; }
    .wide { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div class="backdrop" id="backdrop"></div>

<header class="top">
  <button class="btn small" id="btnMenu" type="button" aria-label="步驟列表">☰ 步驟</button>
  <div class="brand">
    <h1 id="docTitle">L11 組裝教學</h1>
    <p><span id="deviceName">2U 示範伺服器</span><span class="code-pill" id="deviceCode">SRV-2U-DEMO</span></p>
  </div>
  <div class="actions">
    <button class="btn small" id="btnScan" type="button">掃描<span class="wide">設備</span></button>
    <button class="btn small" id="btnGesture" type="button">手勢</button>
    <a class="btn small" id="btnAR" href="#">AR</a>
    <button class="btn small ghost" id="btnReset" type="button">重設</button>
  </div>
</header>

<aside class="sidebar" id="sidebar">
  <div class="side-head"><h2>組裝步驟</h2><span class="prog" id="progText">0／10 完成</span></div>
  <div class="bar" aria-hidden="true"><i id="progBar"></i></div>
  <ul id="stepList"></ul>
  <p class="disclaimer">本頁為機櫃整合（L11）概念的簡化示範。標示「示例」的螺絲數量與力矩並非實機規格，實務請依原廠手冊。</p>
</aside>

<section id="card">
  <div class="sheet-handle" id="sheetHandle" role="presentation"><i></i></div>
  <div class="kicker">
    <span id="stepKicker">步驟 1／10</span>
    <div class="kicker-actions">
      <button class="btn small ghost" id="btnReplay" type="button">重播動畫</button>
      <button class="btn small" id="btnSheet" type="button" aria-expanded="false">說明</button>
    </div>
  </div>
  <h3 id="stepTitle">機殼底座</h3>
  <div class="sheet-body" id="sheetBody">
    <p class="inst" id="stepInst"></p>
    <div class="tools" id="stepTools"></div>
    <p class="notes" id="stepNotes"></p>
    <div class="ann-sec" id="annSec">
      <div class="ann-head">
        <h4 id="annHead">本步驟標註</h4>
        <div class="row">
          <button class="btn small" id="btnAnnotate" type="button">新增</button>
          <button class="btn small ghost" id="btnAnnExport" type="button">匯出</button>
          <label class="btn small ghost file-btn">匯入<input type="file" id="annFile" accept="application/json,.json"></label>
        </div>
      </div>
      <ul class="ann-list" id="annList"></ul>
    </div>
  </div>
  <div class="card-nav">
    <label class="complete"><input type="checkbox" id="chkDone"> 完成</label>
    <button class="btn small" id="btnPrev" type="button">上一步</button>
    <button class="btn small primary" id="btnNext" type="button">下一步</button>
  </div>
  <p class="swipe-hint">在此卡片左右滑動也可切換步驟</p>
</section>

<div id="gesture"><span id="gico">✋</span><span id="gtxt">請把手放進畫面</span></div>
<div id="pip">
  <video id="video" playsinline muted></video>
  <canvas id="hand"></canvas>
</div>

<div id="loading"><div id="loadtxt">載入伺服器模型…</div></div>
<div id="toast"></div>

<div class="modal" id="scanModal" hidden>
  <div class="sheet">
    <h2>掃描設備</h2>
    <p class="lead">對準機箱上的 QR 代碼以載入對應教學。也可以上傳圖片或手動輸入代碼。列印範本請開 <a href="qr.html" target="_blank" rel="noopener">qr.html</a>。</p>
    <div class="scan-view">
      <video id="scanVideo" playsinline muted></video>
      <div class="scan-frame"></div>
    </div>
    <div class="sheet-actions">
      <label class="btn small file-btn">上傳圖片<input type="file" id="qrFile" accept="image/*"></label>
      <input type="text" id="qrManual" placeholder="例如 SRV-2U-DEMO" autocomplete="off" spellcheck="false">
      <button class="btn small primary" id="btnManual" type="button">載入</button>
      <button class="btn small" id="btnScanClose" type="button">關閉</button>
    </div>
  </div>
</div>

<div class="modal" id="annModal" hidden>
  <div class="sheet">
    <h2 id="annModalTitle">新增標註</h2>
    <p class="part-line" id="annPartLine"></p>
    <label class="fld">類型</label>
    <div class="types" id="annTypes"></div>
    <label class="fld">顏色</label>
    <div class="swatches" id="annColors"></div>
    <label class="fld" for="annText">說明文字（選填，最多 80 字）</label>
    <textarea id="annText" maxlength="80" placeholder="例如：對準插座缺口後垂直放下"></textarea>
    <div class="sheet-actions">
      <button class="btn small" id="btnAnnDelete" type="button" hidden>刪除</button>
      <span style="flex:1"></span>
      <button class="btn small" id="btnAnnCancel" type="button">取消</button>
      <button class="btn small primary" id="btnAnnSave" type="button">儲存</button>
    </div>
  </div>
</div>

<div id="arOverlay">
  <div class="ar-bar">
    <p id="arHint">對準桌面或地面，點一下或捏合即可放置</p>
    <div class="ar-actions">
      <button id="btnARPrev" class="btn small" type="button">上一步</button>
      <button id="btnARReplay" class="btn small" type="button">重播</button>
      <button id="btnARNext" class="btn small primary" type="button">下一步</button>
      <button id="btnARAnn" class="btn small" type="button">標註</button>
      <button id="btnARPlace" class="btn small" type="button">移動</button>
      <button id="btnARExit" class="btn small" type="button">結束 AR</button>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
