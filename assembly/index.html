<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轉到組裝教學</title>
<script>
(function () {
  var p = new URLSearchParams(location.search || '');
  if (!p.get('mode')) p.set('mode', 'assembly');
  location.replace('../?' + p.toString() + (location.hash || ''));
})();
</script>
</head>
<body>
<p><a id="go" href="../?mode=assembly">前往組裝教學</a></p>
<script>
(function () {
  var p = new URLSearchParams(location.search || '');
  if (!p.get('mode')) p.set('mode', 'assembly');
  document.getElementById('go').href = '../?' + p.toString() + (location.hash || '');
})();
</script>
</body>
</html>
